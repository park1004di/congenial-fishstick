<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>미얀마 금 시세 | 세계 금 + 미얀마 금값 (페예별 매수/매도)</title>
<meta name="description" content="미얀마 금 시세 — 세계 금 가격과 미얀마 현지 금값(16페예·15페예)을 매일 업데이트">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:'Noto Sans KR', -apple-system, 'Malgun Gothic', sans-serif;
    background: linear-gradient(160deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    min-height:100vh; color:#222; padding-bottom:40px;
  }
  .wrap { max-width:480px; margin:0 auto; padding:0 14px; }
  header { text-align:center; padding:30px 16px 18px; color:#fff; }
  header .flag { font-size:40px; }
  header h1 { font-size:22px; font-weight:900; margin-top:8px; letter-spacing:-0.5px; }
  header p  { font-size:13px; opacity:.75; margin-top:6px; }

  /* 탭 메뉴 */
  .tabs { display:flex; gap:8px; margin:0 0 16px; }
  .tabs a {
    flex:1; text-align:center; text-decoration:none; font-family:inherit;
    font-size:13px; font-weight:800; padding:11px 4px; border-radius:12px;
    background:rgba(255,255,255,.12); color:rgba(255,255,255,.75); transition:background .15s;
  }
  .tabs a.active { background:#f5b942; color:#1a2a33; }

  .card {
    background:#fff; border-radius:20px; padding:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.25); margin-bottom:14px;
  }

  /* 세계 금 시세 */
  .world {
    background: linear-gradient(135deg, #f7d774 0%, #d4a017 100%);
    border-radius:20px; padding:20px; color:#3d2b00; text-align:center;
    box-shadow:0 10px 30px rgba(212,160,23,.35); margin-bottom:14px;
  }
  .world .label { font-size:13px; font-weight:700; opacity:.85; }
  .world .value { font-size:34px; font-weight:900; margin:6px 0 2px; letter-spacing:-1px; }
  .world .unit  { font-size:15px; font-weight:700; }
  .world .sub   { font-size:12px; opacity:.8; margin-top:8px; line-height:1.7; }
  .chg-up   { color:#c62828; font-weight:800; }
  .chg-down { color:#1565c0; font-weight:800; }
  .chg-zero { color:#78909c; font-weight:800; }

  /* 미얀마 금 목록 */
  h2.sec { font-size:15px; font-weight:900; color:#fff; margin:20px 4px 10px; }
  .gold-item {
    background:#fff; border-radius:16px; padding:16px 18px; margin-bottom:10px;
    box-shadow:0 4px 14px rgba(0,0,0,.15);
  }
  .gold-item .gname { font-size:15px; font-weight:800; color:#2c5364; }
  .gold-item .gname .gun { font-size:11px; color:#999; font-weight:500; margin-left:6px; }
  .gold-item .grow { display:flex; justify-content:space-between; margin-top:10px; gap:8px; }
  .gold-item .gcol { flex:1; background:#faf6ec; border-radius:12px; padding:10px; text-align:center; }
  .gold-item .gcol .gt { font-size:11px; color:#a08430; font-weight:700; }
  .gold-item .gcol .gv { font-size:17px; font-weight:900; color:#3d2b00; margin-top:3px; }
  .gold-item .gcol .gc { font-size:11px; margin-top:3px; }

  .updated { text-align:center; font-size:11px; color:rgba(255,255,255,.65); margin:16px 0 4px; }
  .notice  { font-size:11px; color:rgba(255,255,255,.55); text-align:center; line-height:1.7; margin-top:6px; }

  /* 광고 배너 */
  .ads { margin-top:26px; }
  .ads h2 { font-size:13px; font-weight:700; color:rgba(255,255,255,.6); margin:0 4px 10px; }
  .ad-img {
    display:block; border-radius:16px; margin-bottom:10px; overflow:hidden;
    box-shadow:0 6px 18px rgba(0,0,0,.25); transition:transform .12s;
  }
  .ad-img:active { transform:scale(.98); }
  .ad-img img { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="flag">🥇</div>
    <h1>미얀마 금 시세</h1>
    <p>세계 금 가격 + 미얀마 현지 금값 (페예별 매수/매도)</p>
  </header>

  <!-- 탭 메뉴 -->
  <div class="tabs">
    <a href="index.html">💱 환율</a>
    <a href="gold.html" class="active">🥇 금</a>
    <a href="petrol.html">⛽ 기름</a>
  </div>

  <!-- 세계 금 시세 -->
  <div class="world">
    <div class="label">🌍 세계 금 시세 (World Gold)</div>
    <div class="value" id="wgValue">-</div>
    <div class="sub" id="wgSub">1 oz · gram · 쨌타(16.6g) 기준</div>
  </div>

  <!-- 미얀마 금 목록 -->
  <h2 class="sec">🇲🇲 미얀마 현지 금값 (1g 기준)</h2>
  <div id="goldList"></div>

  <div class="updated" id="updatedAt">불러오는 중...</div>
  <div class="notice">
    ※ 미얀마 금값은 양곤 금은방 시세이며 지역·상점별로 다를 수 있습니다.<br>
    ※ 페예(Pe Ye)는 금의 순도 단위로, 16페예가 순금(24K)입니다.<br>
    ※ 미얀마 금 거래 단위 1쨌타(Kyattha) = 약 16.6g입니다.
  </div>

  <!-- ===== 광고 배너 ===== -->
  <div class="ads">
    <h2>📢 미얀마 여행 파트너</h2>
    <a class="ad-img" id="bannerGenie" href="http://pf.kakao.com/_xovhJG/chat" target="_blank" rel="noopener">
      <img src="banner-genie.png" alt="지니투어 미얀마 - 카카오톡으로 문의하기">
    </a>
    <a class="ad-img" id="bannerGoto" href="https://cafe.naver.com/templar777" target="_blank" rel="noopener">
      <img src="banner-goto.png" alt="고투미얀마 - 네이버 카페 바로가기">
    </a>
    <a class="ad-img" id="bannerChat" href="https://open.kakao.com/o/gHQQtHE" target="_blank" rel="noopener">
      <img src="banner-chat.jpg" alt="미얀마 여행자 단톡방 - 카카오톡 오픈채팅 참여하기">
    </a>
  </div>

</div>

<script>
/* ===== 🎛️ 배너 표시 설정 ===== */
const SHOW_CHAT_BANNER = true;
const SHOW_GENIE_BANNER = true;
const SHOW_GOTO_BANNER = true;

const fmt = n => n.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
const fmtI = n => Math.round(n).toLocaleString('ko-KR');
function chgHtml(v) {
  const cls = v > 0 ? 'chg-up' : v < 0 ? 'chg-down' : 'chg-zero';
  const arrow = v > 0 ? '▲' : v < 0 ? '▼' : '–';
  return `<span class="${cls}">${arrow} ${fmtI(Math.abs(v))}</span>`;
}

fetch('gold.json?t=' + Date.now())
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(d => {
    /* 세계 금 */
    if (d.world) {
      const w = d.world;
      document.getElementById('wgValue').innerHTML =
        `$${fmt(w.usd_per_oz)} <span class="unit">/ oz</span> ${chgHtml(w.change)}`;
      document.getElementById('wgSub').textContent =
        `1g = $${fmt(w.usd_per_gram)} · 1쨌타 = $${fmt(w.usd_per_kyattha)}`;
    } else {
      document.getElementById('wgValue').textContent = '데이터 없음';
    }

    /* 미얀마 금 — 한국인 기준 1g 단위로 표시 (금 쨌타 = 16.6g) */
    const KYATTHA_G = 16.6;
    const box = document.getElementById('goldList');
    box.innerHTML = '';
    (d.myanmar || []).forEach(g => {
      const gBuy = g.buy / KYATTHA_G, gSell = g.sell / KYATTHA_G;
      const div = document.createElement('div');
      div.className = 'gold-item';
      div.innerHTML = `
        <div class="gname">${g.name}<span class="gun">1g 기준 · 1쨌타(16.6g) = ${fmtI(g.buy)}짯</span></div>
        <div class="grow">
          <div class="gcol">
            <div class="gt">살 때 (Buy) · 1g</div>
            <div class="gv">${fmtI(gBuy)}짯</div>
            <div class="gc">${chgHtml(g.buy_change / KYATTHA_G)}</div>
          </div>
          <div class="gcol">
            <div class="gt">팔 때 (Sell) · 1g</div>
            <div class="gv">${fmtI(gSell)}짯</div>
            <div class="gc">${chgHtml(g.sell_change / KYATTHA_G)}</div>
          </div>
        </div>`;
      box.appendChild(div);
    });
    if (!d.myanmar || !d.myanmar.length)
      box.innerHTML = '<div class="card" style="text-align:center;font-size:13px;color:#90a4ae;">금 데이터를 불러오지 못했습니다.</div>';

    document.getElementById('updatedAt').textContent = `금 시세 업데이트: ${d.date || ''} · 매일 자동 갱신`;
  })
  .catch(() => {
    document.getElementById('updatedAt').textContent = '데이터를 불러오지 못했습니다. 잠시 후 다시 시도해주세요.';
  });

if (!SHOW_CHAT_BANNER)  document.getElementById('bannerChat').style.display  = 'none';
if (!SHOW_GENIE_BANNER) document.getElementById('bannerGenie').style.display = 'none';
if (!SHOW_GOTO_BANNER)  document.getElementById('bannerGoto').style.display  = 'none';
</script>
</body>
</html>
