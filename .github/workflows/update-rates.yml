# GitHub Actions: 환율 자동 갱신 + 실패 시 이메일 알림
# 미얀마 시간(UTC+6:30) 오전 9시 ~ 오후 9시 사이 30분 간격으로 확인
# = UTC 02:30, 그리고 03:00~14:30 매시간 00분/30분
# 밤 시간대(미얀마 21:30~익일 08:30)는 변동이 거의 없어 실행하지 않음
# 사용법: 이 파일을 저장소의 .github/workflows/ 폴더에 넣으세요
# 배포: Cloudflare Pages가 main 브랜치 변경(커밋)을 감지해 자동 재배포합니다 (별도 설정 불필요)
name: Update MMK exchange rates

on:
  schedule:
    - cron: "30 2 * * *"       # UTC 02:30 = 미얀마 09:00 (아침 환율 변동 시점)
    - cron: "0,30 3-14 * * *"  # UTC 03:00~14:30 30분 간격 = 미얀마 09:30 ~ 21:00
  workflow_dispatch:        # 수동 실행 버튼도 활성화

permissions:
  contents: write
  issues: write   # 실패 시 이슈 생성(알림)용

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest rates
        run: python update_rates.py

      - name: Commit updated files (changed rates only)
        run: |
          git config user.name "rate-bot"
          git config user.email "rate-bot@users.noreply.github.com"
          git add rates.json history.csv history.json status.json market_log.json gold.json petrol.json
          # rates.json의 updated 날짜나 실제 환율 값이 바뀐 경우에만 커밋 (시간만 달라진 빈 커밋 방지)
          if git diff --cached --quiet; then
            echo "환율 변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 환율 갱신 $(date -u +%Y-%m-%d) $(date -u +%H:%M) UTC"
            git push
          fi

      # ── 실패 시 백업 알림: GitHub 이슈 생성 → 계정 이메일로 알림 발송 ──
      - name: 실패 알림 이슈 생성
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'rate-alert'
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner, repo,
                title: `⚠️ 환율 자동 갱신 실패 (${new Date().toISOString().slice(0,10)})`,
                body: '환율 자동 수집이 실패했습니다.\n\n확인 방법:\n1. 저장소 Actions 탭에서 실패 로그 확인\n2. status.json 파일에서 어느 소스가 실패했는지 확인\n3. 소스 사이트 구조가 바뀌었으면 update_rates.py 수정 필요\n\n해결되면 이 이슈를 닫아주세요.',
                labels: ['rate-alert']
              });
            }
